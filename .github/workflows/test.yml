name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Shell syntax
        run: bash -n install.sh
      - name: npx skill discovery
        run: npx --yes skills add . --list
      - name: Synthetic EPUB pipeline
        run: python3 skills/epub-translation-id/tests/test_pipeline.py
